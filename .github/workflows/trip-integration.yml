name: TRIP integration bootstrap

on:
  pull_request:
    paths:
      - 'src/adapters/trip-read-client.ts'
      - 'src/mcp/trip-tools.ts'
      - 'src/trip-index.ts'
      - 'tests/trip-read-client.test.ts'
      - 'integrations/**'
      - 'scripts/*travel-workspace*'
      - '.github/workflows/trip-integration.yml'
  push:
    branches: [main]
    paths:
      - 'src/adapters/trip-read-client.ts'
      - 'src/mcp/trip-tools.ts'
      - 'src/trip-index.ts'
      - 'tests/trip-read-client.test.ts'
      - 'integrations/**'
      - 'scripts/*travel-workspace*'
      - '.github/workflows/trip-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm run build
      - name: Check bootstrap script syntax
        run: node --check scripts/bootstrap-travel-workspace.mjs

  source-package:
    needs: bridge-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned upstream sources and app overlay
        run: node scripts/bootstrap-travel-workspace.mjs "$RUNNER_TEMP/travel-workspace"
      - name: Check local-only app Compose configuration
        run: docker compose -f "$RUNNER_TEMP/travel-workspace/travel-planning-app/docker-compose.travel.yml" config --quiet
      - name: Check upstream backend syntax (not a live integration test)
        run: python -m compileall -q "$RUNNER_TEMP/travel-workspace/travel-planning-app/backend"
      - name: Package source-only archives with original licenses
        run: python scripts/package-travel-workspace.py "$RUNNER_TEMP/travel-workspace" "$RUNNER_TEMP/travel-artifacts"
      - name: Verify refusal to overwrite an existing workspace
        shell: bash
        run: |
          if node scripts/bootstrap-travel-workspace.mjs "$RUNNER_TEMP/travel-workspace"; then
            echo 'ERROR: existing workspace was not protected'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: travel-workspace-sources
          path: ${{ runner.temp }}/travel-artifacts/*
          if-no-files-found: error
          retention-days: 14
