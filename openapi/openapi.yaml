openapi: 3.1.0
info:
  title: Travel Planning API
  version: 0.3.0
  description: >-
    Canonical travel planning API used alongside the MCP server. AI-originated
    mutations become ChangeProposal objects. Approval/apply/rollback operations
    use a separate operator credential. Retry-sensitive writes support
    Idempotency-Key and return Idempotent-Replayed when a stored response is replayed.
servers:
  - url: http://127.0.0.1:8787/v1
    description: Default local development server
security:
  - bearerAuth: []
paths:
  /providers:
    get:
      summary: Describe configured place and route providers
      description: Use the live flag before treating place/route output as current provider data.
      responses:
        '200':
          description: Provider descriptors
          content:
            application/json:
              schema:
                type: object
                required: [places, routes]
                properties:
                  places: { $ref: '#/components/schemas/ProviderDescriptor' }
                  routes: { $ref: '#/components/schemas/ProviderDescriptor' }
  /trips:
    get:
      summary: List trips
      responses:
        '200':
          description: Trip summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [trip_id, version, title, start_date, end_date, status, updated_at]
                  properties:
                    trip_id: { type: string, format: uuid }
                    version: { type: integer, minimum: 1 }
                    title: { type: string }
                    start_date: { type: string, format: date }
                    end_date: { type: string, format: date }
                    status: { type: string }
                    updated_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /trips/{tripId}:
    get:
      summary: Read a canonical trip
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: version
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Trip snapshot and available versions
          content:
            application/json:
              schema:
                type: object
                required: [trip, versions]
                properties:
                  trip: { $ref: '../schemas/trip.schema.json' }
                  versions:
                    type: array
                    items: { type: integer, minimum: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /trips/{tripId}/context:
    get:
      summary: Read AI-friendly aggregate trip context
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: version
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Trip with referenced places, reservations, constraints, and versions
          content:
            application/json:
              schema:
                type: object
                required: [trip, places, reservations, constraints, versions]
                properties:
                  trip: { $ref: '../schemas/trip.schema.json' }
                  places:
                    type: array
                    items: { $ref: '../schemas/place.schema.json' }
                  reservations:
                    type: array
                    items: { $ref: '../schemas/reservation.schema.json' }
                  constraints:
                    type: array
                    items: { $ref: '../schemas/constraint.schema.json' }
                  versions:
                    type: array
                    items: { type: integer, minimum: 1 }
        '404': { $ref: '#/components/responses/NotFound' }
  /trips/{tripId}/constraints:
    get:
      summary: Read constraints for a trip
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Constraints
          content:
            application/json:
              schema:
                type: object
                required: [constraints]
                properties:
                  constraints:
                    type: array
                    items: { $ref: '../schemas/constraint.schema.json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /trips/{tripId}/audit:
    get:
      summary: Read proposal/rollback audit events for a trip
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200': { description: Audit events }
        '404': { $ref: '#/components/responses/NotFound' }
  /trips/{tripId}/proposals:
    post:
      summary: Create a change proposal
      description: >-
        Creates a draft bound to the current trip version. Does not mutate the trip.
        Idempotency-Key is optional but recommended for automatic clients.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProposalRequest' }
      responses:
        '201':
          description: Draft proposal
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '../schemas/change-proposal.schema.json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /trips/{tripId}/rollback:
    post:
      summary: Restore an older snapshot as a new trip version
      description: Requires Bearer auth, X-Approval-Key, and Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/ApprovalKey'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_version, actor_id]
              properties:
                target_version: { type: integer, minimum: 1 }
                actor_id: { type: string, minLength: 1 }
      responses:
        '200':
          description: New trip version restored from older snapshot
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '../schemas/trip.schema.json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ApprovalUnauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /places/search:
    get:
      summary: Search the configured PlaceProvider
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 25, default: 10 }
      responses:
        '200':
          description: Normalized places plus provider descriptor
          content:
            application/json:
              schema:
                type: object
                required: [provider, places]
                properties:
                  provider: { $ref: '#/components/schemas/ProviderDescriptor' }
                  places:
                    type: array
                    items: { $ref: '../schemas/place.schema.json' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /places/{placeId}:
    get:
      summary: Read one normalized place
      parameters:
        - name: placeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Place
          content:
            application/json:
              schema: { $ref: '../schemas/place.schema.json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reservations/{reservationId}:
    get:
      summary: Read one reservation
      parameters:
        - name: reservationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reservation
          content:
            application/json:
              schema: { $ref: '../schemas/reservation.schema.json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /routes/estimate:
    post:
      summary: Calculate a route through the configured RouteProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_place_id, to_place_id, mode]
              properties:
                from_place_id: { type: string, format: uuid }
                to_place_id: { type: string, format: uuid }
                mode: { enum: [walking, transit, rail, taxi, car, bike] }
      responses:
        '200': { description: Route result with source and calculated_at metadata }
        '400': { $ref: '#/components/responses/BadRequest' }
  /proposals/{proposalId}:
    get:
      summary: Read a proposal
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Proposal
          content:
            application/json:
              schema: { $ref: '../schemas/change-proposal.schema.json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /proposals/{proposalId}/validate:
    post:
      summary: Simulate and validate a proposal
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Validated proposal
          content:
            application/json:
              schema: { $ref: '../schemas/change-proposal.schema.json' }
        '409': { $ref: '#/components/responses/Conflict' }
  /proposals/{proposalId}/approve:
    post:
      summary: Human/operator approval of a validated proposal
      description: Requires X-Approval-Key. Idempotency-Key is optional but recommended.
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/ApprovalKey'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_id]
              properties:
                actor_id: { type: string, minLength: 1 }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Proposal with approval receipt
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '../schemas/change-proposal.schema.json' }
        '401': { $ref: '#/components/responses/ApprovalUnauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /proposals/{proposalId}/reject:
    post:
      summary: Reject a proposal
      description: Requires X-Approval-Key. Idempotency-Key is optional but recommended.
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/ApprovalKey'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_id]
              properties:
                actor_id: { type: string, minLength: 1 }
                reason: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Rejected proposal
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '../schemas/change-proposal.schema.json' }
  /proposals/{proposalId}/apply:
    post:
      summary: Apply an approved proposal
      description: >-
        Requires X-Approval-Key, Idempotency-Key, a stored approval receipt, and
        apply-time revalidation. Creates Trip vN+1 exactly once per idempotency scope/key.
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/ApprovalKey'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200':
          description: Proposal and new trip version
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema:
                type: object
                required: [proposal, trip]
                properties:
                  proposal: { $ref: '../schemas/change-proposal.schema.json' }
                  trip: { $ref: '../schemas/trip.schema.json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ApprovalUnauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: TRAVEL_API_KEY when configured. Required for non-loopback deployments.
  headers:
    IdempotentReplayed:
      description: true when this response was replayed from a previous successful request.
      schema: { type: string, enum: ['true', 'false'] }
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalKey:
      name: X-Approval-Key
      in: header
      required: true
      schema: { type: string }
      description: Separate operator credential; never expose it to ordinary AI clients.
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
  schemas:
    ProviderDescriptor:
      type: object
      required: [id, live, description]
      properties:
        id: { type: string }
        live: { type: boolean }
        description: { type: string }
    CreateProposalRequest:
      type: object
      required: [operations]
      properties:
        title: { type: string }
        summary: { type: string }
        reason: { type: string }
        model: { type: string }
        actor_id: { type: string }
        operations:
          type: array
          minItems: 1
          items:
            type: object
            required: [operation, target_type]
            properties:
              operation: { enum: [add, remove, move, update, replace] }
              target_type: { enum: [trip_item, place, reservation, constraint] }
              target_id: { type: [string, 'null'] }
              from:
                type: [object, 'null']
                additionalProperties: true
              to:
                type: [object, 'null']
                additionalProperties: true
              reason: { type: [string, 'null'] }
  responses:
    BadRequest:
      description: Invalid request or missing required Idempotency-Key
    Unauthorized:
      description: Missing or invalid Bearer token
    ApprovalUnauthorized:
      description: Missing or invalid X-Approval-Key
    NotFound:
      description: Resource not found
    Conflict:
      description: Invalid state, stale version, protected item, approval conflict, or idempotency conflict
    IdempotencyConflict:
      description: The same Idempotency-Key was reused with a different request fingerprint
